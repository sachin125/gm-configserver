apiVersion: apps/v1
kind: Deployment
metadata:
  name: gm-config-server
  labels:
    app: gm-config-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gm-config-server
  template:
    metadata:
      labels:
        app: gm-config-server
    spec:
      containers:
      - name: config-server
        image: gm-config-server:latest
        ports:
        - containerPort: 9001
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: ENCRYPT_KEY
          valueFrom:
            secretKeyRef:
              name: config-server-secrets
              key: encrypt-key
        - name: GIT_URI
          value: "https://github.com/sachin125/gavayam-config.git"
        - name: GIT_DEFAULT_LABEL
          value: "main"
        - name: EUREKA_URL
          value: "http://eureka-server:9002/eureka"
        - name: CONFIG_USER
          valueFrom:
            secretKeyRef:
              name: config-server-secrets
              key: config-user
        - name: CONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: config-server-secrets
              key: config-password
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: config-server-secrets
              key: admin-user
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: config-server-secrets
              key: admin-password
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /gconfigserver/actuator/health/liveness
            port: 9001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /gconfigserver/actuator/health/readiness
            port: 9001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gm-config-server-service
  labels:
    app: gm-config-server
spec:
  type: ClusterIP
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
  selector:
    app: gm-config-server
---
apiVersion: v1
kind: Secret
metadata:
  name: config-server-secrets
type: Opaque
data:
  encrypt-key: NDVEOOFFQzFFRNYxREY5QUQ4RDNFRUJCMzk3Rjk=
  config-user: Y29uZmlndXNlcg==
  config-password: Y29uZmlnMTIz
